<!DOCTYPE html>
<html>
<head>
<title>Attendance</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h3>Mark Attendance</h3>

Date: <input type="date" id="date"><br><br>

Branch:
<select id="branch">
  <option value="">--Select Branch--</option>
  <option value="Computer Engineering">Computer Engineering</option>
  <option value="Mechanical Engineering">Mechanical Engineering</option>
  <option value="Electrical Engineering">Electrical Engineering</option>
  <option value="Civil Engineering">Civil Engineering</option>
</select>

Semester:
<select id="sem">
  <option value="">--Select--</option>
  <option value="1">1</option><option value="2">2</option>
  <option value="3">3</option><option value="4">4</option>
  <option value="5">5</option><option value="6">6</option>
</select>

Subject:
<select id="subject" onchange="updateGroupOptions()"></select>

Group:
<select id="group" disabled></select>

<button onclick="loadSubjects()">Load Subjects</button>
<button onclick="loadStudents()">Load Students</button>

<table id="tbl"></table>

<button id="submitBtn" onclick="submitAttendance()">Submit</button>
<button onclick="resetForm()">Mark Another Subject</button>

<a href="report.html">Go to Report</a>

<script src="js/app.js"></script>
</body>
</html>
