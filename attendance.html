<!DOCTYPE html>
<html>
<head>
<title>Polytechnic Attendance</title>

<style>
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  border: 1px solid black;
  padding: 6px;
  text-align: center;
}
td:nth-child(3) {
  text-align: left;
}
th {
  background-color: #f2f2f2;
}
</style>

</head>
<body>

<h2>Polytechnic Attendance System</h2>

<label>Branch:</label>
<select id="branch">
  <option value="">-- Select Branch --</option>
  <option value="Computer Engineering">Computer Engineering</option>
  <option value="Mechanical Engineering">Mechanical Engineering</option>
  <option value="Electrical Engineering">Electrical Engineering</option>
  <option value="Civil Engineering">Civil Engineering</option>
</select>

<label>Semester:</label>
<select id="sem">
  <option value="">-- Select Semester --</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
  <option value="6">6</option>
</select>

<button onclick="loadSubjects()">Load Subjects</button>

<br><br>

<label>Subject:</label>
<select id="subject"></select>

<label>Group:</label>
<select id="group">
  <option value="NA">NA</option>
  <option value="A">A</option>
  <option value="B">B</option>
</select>

<button onclick="loadStudents()">Load Students</button>

<br><br>

<button onclick="selectAll(true)">Select All</button>
<button onclick="selectAll(false)">Unselect All</button>

<table>
<thead>
<tr>
  <th>Sr No</th>
  <th>Roll No</th>
  <th>Student Name</th>
  <th>Present</th>
</tr>
</thead>
<tbody id="studentTableBody"></tbody>
</table>

<br>

<button id="submitBtn" onclick="submitAttendance()">Submit Attendance</button>

<script src="js/app.js"></script>
</body>
</html>
